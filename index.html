<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smoke Cloud Guy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Patrick+Hand&display=swap">
<style>
/* Layout: one notebook page. Title top-left, tally top-right, speech + buttons centred, an ink floor line at the bottom where butts pile up. */
:root {
  color-scheme: light;
  --paper: #f3f4f1;
  --grid: #d3d8db;
  --ink: #151515;
  --white: #ffffff;
  --ember: #ff5a1f;
  --filter: #e2a95c;
  --night: #0e0d10;
  --font-display: "Caveat Brush", "Comic Sans MS", "Chalkboard SE", cursive;
  --font-body: "Patrick Hand", "Comic Sans MS", "Chalkboard SE", cursive;
  --floor: 30px;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
html { overflow: hidden; touch-action: none; overscroll-behavior: none; }
body {
  margin: 0;
  overflow: hidden;
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 30px 30px;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 1.25rem;
  line-height: 1.3;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
html.has-guy, html.has-guy * { cursor: none !important; }

main {
  height: 100%;
  display: flex;
  flex-direction: column;
  gap: 1rem;
  padding-block: 1.25rem calc(var(--floor) + 1rem);
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
}
.top {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: flex-start;
  gap: 0.75rem 2rem;
}
.top > * { min-width: 0; }
h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 400;
  font-size: clamp(2.2rem, 6vw, 3.6rem);
  line-height: 0.95;
  text-wrap: balance;
}
.lede { margin: 0.4rem 0 0; max-width: 30ch; }
.tally { text-align: right; }
.tally-label { display: block; font-size: 1rem; letter-spacing: 0.08em; text-transform: uppercase; }
.marks { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px 12px; max-width: 220px; min-height: 30px; }
.five { position: relative; display: inline-flex; gap: 5px; height: 28px; }
.five i { width: 3px; height: 100%; background: var(--ink); border-radius: 2px; transform: rotate(4deg); }
.five i:nth-child(2n) { transform: rotate(-3deg); height: 92%; }
.five.full::after {
  content: ""; position: absolute; left: -5px; right: -5px; top: 50%;
  height: 3px; background: var(--ink); border-radius: 2px; transform: rotate(-24deg);
}

.stage {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1.75rem;
  min-height: 0;
}
.say {
  position: relative;
  margin: 0;
  max-width: 22ch;
  padding: 0.7rem 1.2rem;
  background: var(--white);
  border: 3px solid var(--ink);
  border-radius: 255px 18px 225px 18px / 18px 225px 18px 255px;
  font-family: var(--font-display);
  font-size: clamp(1.5rem, 4.5vw, 2.1rem);
  line-height: 1.05;
  text-align: center;
  text-wrap: balance;
}
.buttons { display: flex; flex-wrap: wrap; justify-content: center; gap: 1.25rem; }
button {
  font: inherit;
  font-size: 1.4rem;
  color: var(--ink);
  background: var(--white);
  border: 3px solid var(--ink);
  border-radius: 18px 225px 18px 255px / 255px 18px 225px 18px;
  padding: 0.5rem 1.4rem 0.6rem;
  box-shadow: 4px 5px 0 var(--ink);
  transition: transform 0.12s, box-shadow 0.12s;
}
button:hover { transform: translate(-2px, -3px) rotate(-1.5deg); box-shadow: 6px 8px 0 var(--ink); }
button:active { transform: translate(3px, 4px); box-shadow: 1px 1px 0 var(--ink); }
button:focus-visible { outline: 3px dashed var(--ember); outline-offset: 5px; }

.floor {
  position: fixed; left: 0; right: 0; bottom: 0;
  height: var(--floor);
  border-top: 4px solid var(--ink);
  border-radius: 40% 60% 0 0 / 3px 4px 0 0;
  background: var(--paper);
}

#fx { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 50; pointer-events: none; }
#block { position: fixed; inset: 0; z-index: 40; }

#hint {
  position: fixed; left: 0; right: 0; z-index: 60;
  bottom: calc(14vh + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; align-items: center; gap: 0.8rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  color: var(--paper);
  font-family: var(--font-display);
  font-size: clamp(1.5rem, 5vw, 2.2rem);
  text-align: center;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.25s;
}
html.dark #hint { opacity: 1; transition: opacity 0.5s 0.7s; }
.wheel {
  width: 30px; height: 48px;
  border: 3px solid var(--paper);
  border-radius: 16px;
  display: flex; justify-content: center;
}
.wheel i { width: 4px; height: 10px; margin-top: 7px; border-radius: 2px; background: var(--ember); animation: wheel 1.1s ease-in-out infinite; }
@keyframes wheel { 0% { transform: translateY(0); opacity: 1; } 70% { transform: translateY(14px); opacity: 0; } 100% { transform: translateY(0); opacity: 0; } }
#hint.nope { animation: nope 0.4s; }
@keyframes nope { 20% { transform: translateX(-10px); } 40% { transform: translateX(9px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(4px); } }
@media (pointer: coarse) {
  .wheel { border-radius: 16px 16px 20px 20px; height: 40px; }
}
@media (prefers-reduced-motion: reduce) {
  .wheel i, #hint.nope { animation: none; }
  button { transition: none; }
}
</style>
</head>
<body>
<main id="page">
  <div class="top">
    <div>
      <h1>Smoke Cloud Guy</h1>
      <p class="lede">He is your cursor. Click with the lit end. Every click puts it out.</p>
    </div>
    <div class="tally">
      <span class="tally-label">Burned</span>
      <div class="marks" id="marks" role="img" aria-label="0 cigarettes burned"></div>
    </div>
  </div>
  <div class="stage">
    <p class="say" id="say">Go on. Click something.</p>
    <div class="buttons">
      <button type="button" id="btn-say">Say something</button>
      <button type="button" id="btn-sweep">Sweep the floor</button>
    </div>
  </div>
</main>
<div class="floor" aria-hidden="true"></div>
<div id="block" hidden></div>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="hint" aria-live="polite">
  <span class="wheel" aria-hidden="true"><i></i></span>
  <span id="hint-text">Scroll to light another one</span>
</div>

<script>
(() => {
  'use strict';
  const cv = document.getElementById('fx');
  const ctx = cv.getContext('2d');
  const page = document.getElementById('page');
  const block = document.getElementById('block');
  const hint = document.getElementById('hint');
  const hintText = document.getElementById('hint-text');
  const sayEl = document.getElementById('say');
  const marksEl = document.getElementById('marks');
  const root = document.documentElement;
  const coarse = matchMedia('(pointer: coarse)').matches;
  const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const css = getComputedStyle(root);
  const C = {
    ink: css.getPropertyValue('--ink').trim(),
    white: css.getPropertyValue('--white').trim(),
    ember: css.getPropertyValue('--ember').trim(),
    filter: css.getPropertyValue('--filter').trim(),
    night: css.getPropertyValue('--night').trim(),
  };
  const HINT = coarse ? 'Swipe to light another one' : 'Scroll to light another one';
  hintText.textContent = HINT;
  root.classList.add('has-guy');

  /* ---------- sizes ---------- */
  let W = 0, H = 0, DPR = 1, S = 1, FLOOR = 0;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    S = Math.max(0.68, Math.min(1, W / 900));
    FLOOR = H - 30;
  }
  resize();
  window.addEventListener('resize', resize);

  /* ---------- sound (synthesised, no files) ---------- */
  let ac = null, noiseBuf = null;
  function audio(create) {
    if (!ac && create) {
      try {
        ac = new (window.AudioContext || window.webkitAudioContext)();
        noiseBuf = ac.createBuffer(1, ac.sampleRate * 1.5, ac.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      } catch (e) { ac = null; }
    }
    if (ac && ac.state === 'suspended') ac.resume().catch(() => {});
    return ac;
  }
  function noise(o) {
    const a = audio(false); if (!a) return;
    const t = a.currentTime + (o.delay || 0);
    const src = a.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
    const f = a.createBiquadFilter(); f.type = o.type; f.Q.value = o.q || 0.7;
    f.frequency.setValueAtTime(o.f0, t);
    f.frequency.exponentialRampToValueAtTime(o.f1 || o.f0, t + o.dur);
    const g = a.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(o.vol, t + (o.attack || 0.005));
    g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
    src.connect(f); f.connect(g); g.connect(a.destination);
    src.start(t, Math.random()); src.stop(t + o.dur + 0.05);
  }
  function tick(freq, vol) {
    const a = audio(false); if (!a) return;
    const t = a.currentTime;
    const o = a.createOscillator(); o.type = 'square';
    o.frequency.setValueAtTime(freq, t);
    o.frequency.exponentialRampToValueAtTime(freq * 0.3, t + 0.035);
    const g = a.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.04);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + 0.05);
  }
  const sfx = {
    flint() { tick(1900, 0.12); noise({ type: 'bandpass', f0: 5200, f1: 3200, q: 1.2, dur: 0.07, vol: 0.35 }); },
    flame() {
      noise({ type: 'lowpass', f0: 260, f1: 1100, dur: 0.75, vol: 0.5, attack: 0.07 });
      noise({ type: 'highpass', f0: 2600, dur: 0.5, vol: 0.06, attack: 0.05, delay: 0.05 });
    },
    hiss() { noise({ type: 'highpass', f0: 5200, f1: 2400, dur: 0.42, vol: 0.28 }); },
    thud() { noise({ type: 'lowpass', f0: 420, f1: 120, dur: 0.09, vol: 0.3 }); },
  };

  /* ---------- the guy ---------- */
  const P = { x: W * 0.64, y: H * 0.36 };          // cursor = cigarette tip
  const prev = { x: P.x, y: P.y };
  const vel = { x: 0, y: 0 };
  let ang = 0.5;                                     // direction the cigarette points
  const nS = { x: 0.48, y: -0.88 };                  // smoothed "up" side, where the eyes sit
  let face = 1;
  const look = { x: 0.6, y: 0.3 };
  let glance = { x: 0, y: 0, t: 0 };
  let blink = 0, nextBlink = 2, shake = 0;

  const R = [26, 35, 39, 35, 29, 23, 17, 12, 8];     // cloud body, head to tail
  const nodes = R.map(() => ({ x: P.x, y: P.y }));
  const puffs = [], sparks = [], butts = [];
  let bodyScale = 1, moved = 0, idlePuff = 0;
  const cig = { present: true, lit: true, grow: 1 };

  let state = 'lit';                                 // lit | dying | dark | lighting
  let stateT = 0, iris = { x: 0, y: 0 }, flash = 0, flame = 0, acc = 0, lastSpark = 0;
  let burned = 0, time = 0;

  const rnd = (a, b) => a + Math.random() * (b - a);

  function basis() {
    const d = { x: Math.cos(ang), y: Math.sin(ang) };
    const n = d.x >= 0 ? { x: d.y, y: -d.x } : { x: -d.y, y: d.x };
    return { d, n };
  }

  function simulate(dt) {
    vel.x += ((P.x - prev.x) / dt - vel.x) * Math.min(1, dt * 12);
    vel.y += ((P.y - prev.y) / dt - vel.y) * Math.min(1, dt * 12);
    const step = Math.hypot(P.x - prev.x, P.y - prev.y);
    prev.x = P.x; prev.y = P.y;
    const speed = Math.hypot(vel.x, vel.y);

    if (speed > 70) {
      let diff = Math.atan2(vel.y, vel.x) - ang;
      diff = Math.atan2(Math.sin(diff), Math.cos(diff));
      ang += diff * Math.min(1, dt * 9);
    }
    const { d, n } = basis();
    const k = Math.min(1, dt * 10);
    nS.x += (n.x - nS.x) * k; nS.y += (n.y - nS.y) * k;
    const nl = Math.hypot(nS.x, nS.y) || 1; nS.x /= nl; nS.y /= nl;
    face += ((d.x >= 0 ? 1 : -1) - face) * k;

    // cloud body: each blob chases the one in front of it, drifting back and up
    const L = 76 * S;
    const ax = P.x - d.x * (L + 6 * S) + nS.x * 8 * S;
    const ay = P.y - d.y * (L + 6 * S) + nS.y * 8 * S;
    let bx = -d.x * 0.8, by = -d.y * 0.8 - 0.5;
    const bl = Math.hypot(bx, by) || 1; bx /= bl; by /= bl;
    for (let i = 0; i < nodes.length; i++) {
      const nd = nodes[i];
      let tx = ax, ty = ay;
      if (i > 0) {
        const sp = (R[i - 1] + R[i]) * 0.43 * S;
        tx = nodes[i - 1].x + bx * sp; ty = nodes[i - 1].y + by * sp;
      }
      const f = 1 - Math.exp(-dt * (i === 0 ? 26 : 15 - i));
      nd.x += (tx - nd.x) * f; nd.y += (ty - nd.y) * f;
      if (i > 0) {                                   // never let the body tear apart
        const q = nodes[i - 1], max = (R[i - 1] + R[i]) * 0.62 * S;
        const dx = nd.x - q.x, dy = nd.y - q.y, dist = Math.hypot(dx, dy);
        if (dist > max) { nd.x = q.x + dx / dist * max; nd.y = q.y + dy / dist * max; }
      }
    }

    // smoke trail
    if (bodyScale > 0.6) {
      moved += step;
      while (moved > 24) {
        moved -= 24;
        const src = nodes[5 + Math.floor(Math.random() * 4)];
        puffs.push({ x: src.x + rnd(-6, 6), y: src.y + rnd(-6, 6), r: rnd(9, 17) * S, vx: rnd(-12, 12), vy: rnd(-26, -8), k: rnd(5, 9) });
      }
      idlePuff -= dt;
      if (idlePuff <= 0) {
        idlePuff = rnd(0.35, 0.7);
        const t = nodes[nodes.length - 1];
        puffs.push({ x: t.x, y: t.y, r: rnd(6, 10) * S, vx: rnd(-10, 10), vy: rnd(-34, -18), k: rnd(3, 5) });
      }
    }
    for (let i = puffs.length - 1; i >= 0; i--) {
      const p = puffs[i];
      p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.985; p.r -= p.k * dt;
      if (p.r < 2.5) puffs.splice(i, 1);
    }
    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i];
      s.vy += 520 * dt; s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
      if (s.life <= 0) sparks.splice(i, 1);
    }
    for (let i = butts.length - 1; i >= 0; i--) {
      const b = butts[i];
      b.ember = Math.max(0, b.ember - dt * 0.8);
      if (b.rest && !b.swept) continue;
      b.vy += 1700 * dt; b.x += b.vx * dt; b.y += b.vy * dt; b.rot += b.vr * dt;
      if (b.swept) { if (b.x > W + 60) butts.splice(i, 1); if (b.y > FLOOR - 5) { b.y = FLOOR - 5; b.vy = -Math.abs(b.vy) * 0.4; } continue; }
      if (b.x < 14) { b.x = 14; b.vx = Math.abs(b.vx); }
      if (b.x > W - 14) { b.x = W - 14; b.vx = -Math.abs(b.vx); }
      if (b.y > FLOOR - 5) {
        b.y = FLOOR - 5;
        if (!b.hit) { b.hit = true; sfx.thud(); }
        if (Math.abs(b.vy) < 150) { b.rest = true; b.rot = rnd(-0.12, 0.12) + (Math.random() < 0.5 ? Math.PI : 0); }
        else { b.vy = -b.vy * 0.35; b.vx *= 0.6; b.vr *= 0.5; }
      }
    }

    // eyes
    nextBlink -= dt;
    if (nextBlink <= 0) { blink = 0.14; nextBlink = rnd(1.8, 4.5); }
    blink = Math.max(0, blink - dt);
    shake = Math.max(0, shake - dt);
    let lx, ly;
    if (state === 'dying') { lx = 0; ly = 1; }
    else if (speed > 50) { lx = vel.x / speed; ly = vel.y / speed; }
    else if (state === 'lit' || state === 'lighting') { lx = d.x * 0.8; ly = d.y * 0.8; }
    else {
      glance.t -= dt;
      if (glance.t <= 0) { const a = rnd(0, 6.28); glance = { x: Math.cos(a), y: Math.sin(a) * 0.6, t: rnd(0.7, 1.8) }; }
      lx = glance.x; ly = glance.y;
    }
    look.x += (lx - look.x) * Math.min(1, dt * 9);
    look.y += (ly - look.y) * Math.min(1, dt * 9);

    // lights
    stateT += dt;
    flash = Math.max(0, flash - dt * 4.5);
    flame = Math.max(0, flame - dt);
    cig.grow = Math.min(1, cig.grow + dt * 5);
    if (state === 'dying' && stateT > 0.65) state = 'dark';
    if (state === 'lighting') {
      bodyScale = Math.min(1, stateT / 0.8);
      if (stateT > 0.9) { state = 'lit'; block.hidden = true; page.inert = false; }
    }
  }

  /* ---------- drawing ---------- */
  function circle(x, y, r) { ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, 6.2832); }

  function drawSmoke() {
    const blobs = [];
    if (bodyScale > 0.02) {
      for (let i = 0; i < nodes.length; i++) {
        const nd = nodes[i];
        const wob = calm ? 1 : 1 + 0.05 * Math.sin(time * 5 + i * 1.7);
        const r = R[i] * S * bodyScale * wob;
        blobs.push([nd.x, nd.y, r]);
        for (let j = 0; j < 2; j++) {
          const a = i * 2.4 + j * 2.7 + (calm ? 0 : time * 0.5 * (j ? -1 : 1));
          blobs.push([nd.x + Math.cos(a) * r * 0.55, nd.y + Math.sin(a) * r * 0.55, r * 0.62]);
        }
      }
    }
    for (const p of puffs) blobs.push([p.x, p.y, p.r]);
    if (!blobs.length) return;
    ctx.fillStyle = C.ink; ctx.beginPath();
    for (const b of blobs) circle(b[0], b[1], b[2] + 2.8);
    ctx.fill();
    ctx.fillStyle = C.white; ctx.beginPath();
    for (const b of blobs) circle(b[0], b[1], b[2]);
    ctx.fill();
    if (bodyScale > 0.9) {                           // a couple of ink curls inside the cloud
      ctx.strokeStyle = C.ink; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
      for (const i of [1, 3, 5]) {
        const nd = nodes[i], r = R[i] * S * 0.5;
        ctx.beginPath(); ctx.arc(nd.x, nd.y + r * 0.2, r, 0.25 + i, 2.1 + i); ctx.stroke();
      }
    }
  }

  function drawCig() {
    if (!cig.present) return;
    const L = 76 * S, w = 15 * S, e = 10 * S, fl = 23 * S;
    ctx.save();
    ctx.translate(P.x, P.y); ctx.rotate(ang); ctx.scale(cig.grow, cig.grow);
    ctx.lineWidth = 2.8; ctx.strokeStyle = C.ink; ctx.lineJoin = 'round';
    if (cig.lit) {
      const g = 0.5 + 0.5 * Math.sin(time * 9);
      ctx.fillStyle = 'rgba(255,90,31,' + (0.16 + 0.1 * g) + ')';
      ctx.beginPath(); ctx.arc(-e / 2, 0, 15 * S + 3 * g, 0, 6.2832); ctx.fill();
    }
    ctx.fillStyle = C.white;
    ctx.beginPath(); ctx.rect(-L, -w / 2, L - e, w); ctx.fill(); ctx.stroke();
    ctx.fillStyle = C.filter;
    ctx.beginPath(); ctx.rect(-L, -w / 2, fl, w); ctx.fill(); ctx.stroke();
    ctx.fillStyle = cig.lit ? C.ember : '#9a7a52';
    ctx.beginPath(); ctx.rect(-e, -w / 2, e, w); ctx.fill(); ctx.stroke();
    if (cig.lit) {
      ctx.fillStyle = '#ffd84a';
      ctx.beginPath(); ctx.arc(-e * 0.45, 0, 2.4 * S, 0, 6.2832); ctx.fill();
    }
    ctx.restore();
  }

  function drawButts() {
    for (const b of butts) {
      ctx.save();
      ctx.translate(b.x, b.y); ctx.rotate(b.rot);
      ctx.lineWidth = 2.4; ctx.strokeStyle = C.ink; ctx.lineJoin = 'round';
      ctx.fillStyle = C.filter; ctx.beginPath(); ctx.rect(-14, -5, 17, 10); ctx.fill(); ctx.stroke();
      ctx.fillStyle = C.white; ctx.beginPath(); ctx.rect(3, -5, 8, 10); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#3a3836';
      ctx.beginPath(); ctx.moveTo(11, -5); ctx.lineTo(15, -3); ctx.lineTo(13, 1); ctx.lineTo(16, 5); ctx.lineTo(11, 5); ctx.closePath(); ctx.fill(); ctx.stroke();
      if (b.ember > 0) {
        ctx.fillStyle = 'rgba(255,90,31,' + b.ember + ')';
        ctx.beginPath(); ctx.arc(13, 0, 3, 0, 6.2832); ctx.fill();
      }
      ctx.restore();
    }
  }

  function drawDark() {
    if (state === 'lit') return;
    const maxR = Math.hypot(W, H);
    let r = 0, cx = P.x, cy = P.y;
    if (state === 'dying') { const t = Math.min(1, stateT / 0.65); r = maxR * (1 - t) * (1 - t); cx = iris.x; cy = iris.y; }
    else if (state === 'lighting') { const t = Math.min(1, stateT / 0.9); r = 30 + maxR * t * t; }
    else if (flash > 0) r = (18 + 60 * flash) * S;
    ctx.fillStyle = C.night;
    ctx.beginPath(); ctx.rect(0, 0, W, H);
    if (r > 0.5) { ctx.moveTo(cx + r, cy); ctx.arc(cx, cy, r, 0, 6.2832); }
    ctx.fill('evenodd');
  }

  function drawFire() {
    ctx.lineCap = 'round';
    for (const s of sparks) {
      ctx.strokeStyle = s.life > 0.18 ? '#ffe27a' : C.ember;
      ctx.lineWidth = 2.2;
      ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x - s.vx * 0.035, s.y - s.vy * 0.035); ctx.stroke();
    }
    if (flame > 0) {
      const a = Math.min(1, flame * 3) * Math.min(1, (1 - flame) * 8 + 0.2);
      const h = (40 + 7 * Math.sin(time * 31)) * S * a, w = 12 * S * a;
      const sway = Math.sin(time * 17) * 3 * S;
      const shape = (hh, ww, by) => {
        ctx.beginPath(); ctx.moveTo(P.x, P.y + by);
        ctx.bezierCurveTo(P.x - ww * 1.5, P.y + by - hh * 0.35, P.x - ww * 0.4 + sway, P.y + by - hh * 0.7, P.x + sway, P.y + by - hh);
        ctx.bezierCurveTo(P.x + ww * 0.6 + sway, P.y + by - hh * 0.6, P.x + ww * 1.5, P.y + by - hh * 0.35, P.x, P.y + by);
      };
      ctx.lineWidth = 2.6; ctx.strokeStyle = C.ink; ctx.fillStyle = '#ff8a1f';
      shape(h, w, 10 * S); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#ffd84a';
      shape(h * 0.55, w * 0.55, 8 * S); ctx.fill();
    }
  }

  function drawEyes() {
    const d = { x: Math.cos(ang), y: Math.sin(ang) };
    let ex = P.x - d.x * 50 * S + nS.x * 19 * S;
    let ey = P.y - d.y * 50 * S + nS.y * 19 * S;
    if (shake > 0 && !calm) ex += Math.sin(shake * 42) * 9 * (shake / 0.45);
    const wide = state === 'dying' ? 1.15 : 1;
    const sy = blink > 0 ? 0.12 : 1;
    const eyes = [
      { x: 13 * face, y: 3, r: 13.5 * wide },
      { x: -10 * face, y: -1, r: 17 * wide },
    ];
    ctx.lineWidth = 2.8; ctx.strokeStyle = C.ink;
    for (const e of eyes) {
      const x = ex + e.x * S, y = ey + e.y * S, r = e.r * S;
      ctx.fillStyle = C.white;
      ctx.beginPath(); ctx.ellipse(x, y, r, r * sy, 0, 0, 6.2832); ctx.fill(); ctx.stroke();
      if (sy === 1) {
        ctx.fillStyle = C.ink;
        ctx.beginPath(); ctx.ellipse(x + look.x * r * 0.45, y + look.y * r * 0.45, r * 0.27, r * 0.4, 0, 0, 6.2832); ctx.fill();
      }
    }
  }

  function draw() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);
    drawButts();
    drawSmoke();
    drawCig();
    drawDark();
    drawFire();
    drawEyes();
  }

  /* ---------- putting it out, lighting it again ---------- */
  function renderTally() {
    marksEl.textContent = '';
    for (let left = burned; left > 0; left -= 5) {
      const g = document.createElement('span');
      g.className = 'five' + (left >= 5 ? ' full' : '');
      for (let i = 0; i < Math.min(4, left); i++) g.appendChild(document.createElement('i'));
      marksEl.appendChild(g);
    }
    marksEl.setAttribute('aria-label', burned + (burned === 1 ? ' cigarette burned' : ' cigarettes burned'));
  }

  function extinguish() {
    if (state !== 'lit') return;
    state = 'dying'; stateT = 0; acc = 0;
    iris = { x: P.x, y: P.y };
    block.hidden = false; page.inert = true;
    root.classList.add('dark');
    hintText.textContent = HINT;
    const d = { x: Math.cos(ang), y: Math.sin(ang) };
    butts.push({ x: P.x - d.x * 14, y: P.y - d.y * 14, vx: rnd(-140, 140), vy: -260, rot: ang, vr: rnd(-9, 9), ember: 1 });
    if (butts.length > 60) butts.shift();
    cig.present = false; cig.lit = false;
    for (let i = 0; i < nodes.length; i++) {         // the body goes poof
      const nd = nodes[i];
      for (let j = 0; j < 2; j++) {
        const a = rnd(0, 6.28);
        puffs.push({ x: nd.x, y: nd.y, r: R[i] * S * rnd(0.5, 0.8), vx: Math.cos(a) * rnd(30, 110), vy: Math.sin(a) * rnd(30, 110) - 30, k: rnd(22, 34) });
      }
    }
    for (let i = 0; i < 6; i++) puffs.push({ x: P.x, y: P.y, r: rnd(4, 8), vx: rnd(-90, 90), vy: rnd(-120, -20), k: 12 });
    bodyScale = 0;
    burned++; renderTally();
    sfx.hiss();
  }

  function strike(amount) {
    if (state !== 'dark') return;
    audio(false);
    acc += amount;
    const now = performance.now();
    if (now - lastSpark > 110) {
      lastSpark = now; flash = 1;
      if (!cig.present) { cig.present = true; cig.lit = false; cig.grow = 0; }
      for (let i = 0; i < 9; i++) sparks.push({ x: P.x, y: P.y + 8, vx: rnd(-170, 170), vy: rnd(-260, -40), life: rnd(0.15, 0.4) });
      sfx.flint();
    }
    if (acc >= 300) {
      state = 'lighting'; stateT = 0; acc = 0;
      cig.present = true; cig.lit = true; flame = 1;
      root.classList.remove('dark');
      sfx.flame();
    }
  }

  function nope() {
    shake = 0.45;
    hintText.textContent = coarse ? 'No cigarette, no tapping. Swipe.' : 'No cigarette, no clicking. Scroll.';
    hint.classList.remove('nope'); void hint.offsetWidth; hint.classList.add('nope');
  }

  /* ---------- input ---------- */
  let lastTouch = null;
  window.addEventListener('pointermove', (e) => {
    P.x = e.clientX; P.y = e.clientY;
    if (e.pointerType === 'touch') {
      if (lastTouch) strike((Math.abs(e.clientY - lastTouch.y) + Math.abs(e.clientX - lastTouch.x)) * 1.6);
      lastTouch = { x: e.clientX, y: e.clientY };
    }
  });
  window.addEventListener('pointerdown', (e) => {
    audio(true);
    P.x = e.clientX; P.y = e.clientY;
    if (e.pointerType === 'touch') { prev.x = P.x; prev.y = P.y; lastTouch = { x: P.x, y: P.y }; }
  });
  const endTouch = () => { lastTouch = null; };
  window.addEventListener('pointerup', endTouch);
  window.addEventListener('pointercancel', endTouch);
  window.addEventListener('wheel', (e) => {
    e.preventDefault();
    const unit = e.deltaMode === 1 ? 33 : e.deltaMode === 2 ? 300 : 1;
    strike((Math.abs(e.deltaY) + Math.abs(e.deltaX)) * unit);
  }, { passive: false });
  window.addEventListener('keydown', (e) => {
    if (state === 'lit') return;
    if ([' ', 'Enter', 'ArrowDown', 'ArrowUp', 'PageDown', 'PageUp'].includes(e.key)) { e.preventDefault(); audio(true); strike(150); }
  });
  document.addEventListener('click', () => {
    if (state === 'lit') extinguish();
    else if (state === 'dark') nope();
  });

  /* ---------- the two test buttons ---------- */
  const LINES = [
    'That was my last one. Again.',
    'I am mostly cloud. The eyes do the work.',
    'Every click, a small funeral.',
    'You scroll, I spark. Teamwork.',
    'I quit every time you click.',
    'Do not tell the ashtray about us.',
    'Lights out is my thinking time.',
  ];
  let line = -1;
  document.getElementById('btn-say').addEventListener('click', () => {
    line = (line + 1) % LINES.length;
    sayEl.textContent = LINES[line];
  });
  document.getElementById('btn-sweep').addEventListener('click', () => {
    for (const b of butts) { b.swept = true; b.rest = false; b.vx = rnd(700, 1300); b.vy = rnd(-420, -120); b.vr = rnd(8, 20); }
    sayEl.textContent = butts.length ? 'Swept. It will not stay clean.' : 'Nothing to sweep. Yet.';
  });

  /* ---------- go ---------- */
  for (let i = 0; i < 90; i++) simulate(1 / 60);
  puffs.length = 0; time = 0; stateT = 0;
  renderTally();
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, Math.max(0.001, (now - last) / 1000));
    last = now; time += dt;
    simulate(dt);
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
